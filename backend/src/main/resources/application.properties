server.port=8080
server.address=127.0.0.1
server.error.include-stacktrace=never
server.error.include-message=never

# Spring Application Name
spring.application.name=railway-platform-allocation-simulator

# Default Profile: H2 In-Memory (Zero-Friction Staging & Interview Mode)
spring.datasource.url=jdbc:h2:mem:railway_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console: Disabled by default for security; enable only in "dev" profile
spring.h2.console.enabled=false

# Actuator: Limit exposure to health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS Configuration: restricted to frontend origin
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Security Configuration: externalized credentials with dev fallback in dev profile
security.api-key=${SIMULATOR_API_KEY:}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:}

# Jackson Date/Time Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Simulation Engine Parameters (Configurable Simulation Assumptions)
simulation.default-speed=1
simulation.safety-buffer-minutes=3
simulation.platform-reallocation-threshold-minutes=5
