server.port=8080

# Spring Application Name
spring.application.name=railway-platform-allocation-simulator

# Default Profile: H2 In-Memory (Zero-Friction Staging & Interview Mode)
spring.datasource.url=jdbc:h2:mem:railway_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson Date/Time Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Simulation Engine Parameters (Configurable Simulation Assumptions)
simulation.default-speed=1
simulation.safety-buffer-minutes=3
simulation.platform-reallocation-threshold-minutes=5
