# Development Profile
# Enable H2 console for local debugging (localhost only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Development Credentials (Safe default fallback strictly in dev profile)
security.api-key=${SIMULATOR_API_KEY:railway-dev-key-2026}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:dev-admin-pass}
