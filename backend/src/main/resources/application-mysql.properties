# MySQL Production Profile
# Activated via -Dspring.profiles.active=mysql or environment variable SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/railway_simulator?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
